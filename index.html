		<article id="zuolan">
			<!-- 栏目标题 -->
			<div class="ceLanBiaoTou">公 告 栏</div>

			<!-- 公告列表 -->
			<ul class="gongGaoList">
				<li class="gongGaoItem">
					<a href="article.html?id=23">三分钟了解 WebSocket —— 新文章已发布</a>

			</div>

		<article id="youlan">
			<!-- 页面标题（由 JS 动态填入"全部文章"或分类名） -->
			<h2 class="pageTitle" style="text-align:center; color:#333; margin-top:20px;"></h2>

			<!-- 6 个文章卡片容器（JS 每次渲染 6 篇，多余的隐藏） -->
			<section class="wenZhang"></section>
			<section class="wenZhang"></section>
			<section class="wenZhang"></section>
			<section class="wenZhang"></section>
			<section class="wenZhang"></section>
			<section class="wenZhang"></section>

			<!-- 分页按钮区（排序、筛选、页码、上下页）由 JS 动态生成 -->
			<div class="fenYeRongQi"></div>
		</article>

		<!-- ====== 底部版权信息（全站共用） ====== -->
		<footer>
			<section>

		<!-- ★ JS 数据文件 + 核心逻辑：底部加载 + defer，确保 DOM 就绪后执行 -->
		<script src="articles-data.js" defer></script>
		<script src="main.js" defer></script>
