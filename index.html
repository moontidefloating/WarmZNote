<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>温知小筑-首页</title>
		<link rel="stylesheet" href="123.css" />
		<link rel="icon" type="image/png" href="logo.png" />
		<style>
			.souSuoRongQi{display:flex!important;align-items:center;justify-content:center;gap:8px;margin:15px 50px 5px;min-height:44px}
			.souSuoShuRuBox{position:relative;flex:1;max-width:460px}
			.souSuoShuRu{width:100%;padding:9px 34px 9px 14px;border:2px solid #e0c88e;border-radius:20px;background:#FFFAEC;font-size:14px;color:#333;outline:none;box-sizing:border-box}
			.souSuoAnNiu{width:38px;height:38px;flex-shrink:0;border:2px solid #e0c88e;border-radius:50%;background:#f9cd90;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
			.souSuoQingChu{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:18px;color:#bbb;background:none;border:none;cursor:pointer;display:none}
			.souSuoXiaLa{display:none;position:absolute;top:100%;left:0;right:0;margin-top:4px;list-style:none;background:#FFFAEC;border:1px solid #e0c88e;border-radius:10px;z-index:100;max-height:210px;overflow-y:auto;overflow-x:auto}
			.souSuoXiaLa--keJian{display:block}
			.souSuoGaoLiang{color:#D79F52;font-weight:bold}
			.souSuoBiaoTi{color:#333;font-weight:700}
			.souSuoZhangJie{color:#666;font-size:13px;padding-left:8px}
			.souSuoShangXiaWen{color:#999;font-size:12px;padding-left:16px}
		</style>
	</head>
	<body>
		<!-- ====== 顶部导航栏（全站共用） ====== -->
		<header>
			<nav>
				<ul class="nav">
					<li class="nav"><a href="./index.html">首页</a></li>
					<li class="nav"><a href="category.html">分类</a></li>
					<li class="nav"><a href="author.html">作者</a></li>
					<li class="nav"><a href="download.html">下载</a></li>
				</ul>
			</nav>
		</header>

		<!-- ====== 左侧边栏：sticky 吸附，展示公告与博主信息 ====== -->
		<article id="zuolan">
			<!-- 栏目标题 -->
			<div class="ceLanBiaoTou">公 告 栏</div>

			<!-- 公告列表 -->
			<ul class="gongGaoList">
				<li class="gongGaoItem">
					<a href="article.html?id=23">三分钟了解 WebSocket —— 新文章已发布</a>
				</li>
				<li class="gongGaoItem">
					<a href="article.html?id=21">CSS 毛玻璃效果：一行代码搞定</a>
				</li>
				<li class="gongGaoItem">
					<a href="article.html?id=1">Git 工作流最佳实践 持续更新中</a>
				</li>
				<li class="gongGaoItem">
					<a href="#">欢迎在作者页留言交流</a>
				</li>
			</ul>

			<!-- 博主简介 -->
			<div class="ceLanJianJie">
				<p>博主：Mt_7</p>
				<p> · </p>
				<p>记录学习，分享生活。</p>
			</div>
		</article>

		<!-- ====== 右侧内容区：文章卡片列表 + 分页 ====== -->
		<article id="youlan">
			<!-- 页面标题（由 JS 动态填入"全部文章"或分类名） -->
			<h2 class="pageTitle" style="text-align:center; color:#333; margin-top:20px;"></h2>

			<!-- 搜索栏：按关键词过滤文章 -->
			<div class="souSuoRongQi">
				<div class="souSuoShuRuBox">
					<input type="text" id="searchInput" class="souSuoShuRu" placeholder="搜索文章..." autocomplete="off" />
					<button id="searchClear" class="souSuoQingChu" title="清除搜索">&times;</button>
					<ul class="souSuoXiaLa" id="searchSuggest"></ul>
				</div>
				<button id="searchBtn" class="souSuoAnNiu" title="搜索">🔍</button>
			</div>

			<!-- 6 个文章卡片容器（JS 每次渲染 6 篇，多余的隐藏） -->
			<section class="wenZhang"></section>
			<section class="wenZhang"></section>
			<section class="wenZhang"></section>
			<section class="wenZhang"></section>
			<section class="wenZhang"></section>
			<section class="wenZhang"></section>

			<!-- 分页按钮区（排序、筛选、页码、上下页）由 JS 动态生成 -->
			<div class="fenYeRongQi"></div>
		</article>

		<!-- ====== 底部版权信息（全站共用） ====== -->
		<footer>
			<section>
				<p><small><em>仅供学习使用 | © 2026<br />素材来源于网络，如有侵权请联系<br />moontidefloating@gmail.com</em></small></p>
			</section>
		</footer>

		<!-- ★ JS 数据文件 + 核心逻辑：底部加载 + defer，确保 DOM 就绪后执行 -->
		<script src="articles-data.js" defer></script>
		<script src="main.js" defer></script>
	</body>
</html>
